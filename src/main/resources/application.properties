spring.application.name=DOSW-Library
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== HTTPS / SSL-TLS Configuration =====
server.ssl.key-store=classpath:dosw-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dosw-library
server.ssl.key-password=changeit
server.port=8443
server.http2.enabled=true

spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.jakarta.persistence.jdbc.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.properties.jakarta.persistence.jdbc.driver=org.h2.Driver
spring.jpa.properties.jakarta.persistence.jdbc.user=sa
spring.jpa.properties.jakarta.persistence.jdbc.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

security.jwt.secret=VGhpc0lzQVN0cm9uZ0pXVFNlY3JldEtleUZvckRPU1dfTGlicmFyeV8yMDI2X1Bhc3NfQ2hhbmdlTWVQbGVhc2U=
security.jwt.expiration-ms=3600000
security.auth.username=admin
security.auth.password=admin1234

# ===== CORS Configuration (Global) =====
# Configured in SecurityConfig.corsConfigurationSource()
# Allow requests from any origin (change for production)
# Allowed methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
# Allowed headers: * (all headers, including Authorization for Bearer tokens)
# Max age: 3600 seconds (1 hour - cache pre-flight response)
# Allow credentials: true (cookies, authorization headers)
#
# ⚠️ NOTA: For Production, change from "*" to specific allowed origins
# Example: localhost:3000, https://frontend.example.com

# ===== MongoDB (Optional NoSQL Persistence) =====
# Descomentar y configurar estos valores para habilitar MongoDB
# Por defecto, el proyecto usa H2 en memoria (SQL)
# Para usar MongoDB, descomenta las lineas abajo y configura las variables de entorno
#
# spring.data.mongodb.uri=mongodb://localhost:27017/dosw-library
# spring.data.mongodb.database=dosw-library
# spring.data.mongodb.auto-index-creation=true
#
# Para cargar desde archivo .env:
# spring.config.import=optional:file:.env[.properties]
